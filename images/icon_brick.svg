<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 48 48" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <!-- Pineapple cake (鳳梨酥) - small brown pastry cube -->
  <rect x="8" y="14" width="32" height="24" rx="3" fill="#B5651D" stroke="#5B2E1D" stroke-width="2" stroke-linejoin="round"/>
  <!-- top highlight -->
  <rect x="8" y="14" width="32" height="7" rx="3" fill="#C97A33" stroke="#5B2E1D" stroke-width="2" stroke-linejoin="round"/>
  <!-- lattice crust pattern -->
  <g stroke="#5B2E1D" stroke-width="1.3" stroke-linecap="round" opacity="0.75">
    <line x1="8"  y1="24" x2="40" y2="24"/>
    <line x1="8"  y1="30" x2="40" y2="30"/>
    <line x1="16" y1="21" x2="16" y2="38"/>
    <line x1="24" y1="21" x2="24" y2="38"/>
    <line x1="32" y1="21" x2="32" y2="38"/>
  </g>
  <!-- outer outline for crispness -->
  <rect x="8" y="14" width="32" height="24" rx="3" fill="none" stroke="#5B2E1D" stroke-width="2" stroke-linejoin="round"/>
</svg>
